name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No secrets configured or needed: every test uses a fake
      # Voyage/Anthropic client (see tests/fakes.py, tests/fake_anthropic.py)
      # rather than a real network call, so this job runs identically for
      # a fork's pull request with no repo secrets available to it.
      - name: Lint
        run: |
          ruff check app scripts tests wsgi.py
          ruff format --check app scripts tests wsgi.py

      - name: Test (pytest.ini enforces --cov-fail-under=90)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No frontend test framework yet (see ARCHITECTURE.md) — building
      # the production bundle at least catches anything that doesn't
      # compile, which is what a PR-breaking change would look like here.
      - name: Build
        run: npm run build
